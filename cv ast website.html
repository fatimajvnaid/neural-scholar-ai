<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>CV Scholar | AI CV Analysis</title>

<link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700&family=Rajdhani:wght@400;600&family=Inter:wght@300;400&display=swap" rel="stylesheet">
<link href="https://cdn.jsdelivr.net/npm/@n8n/chat/dist/style.css" rel="stylesheet" />

<style>
/* ===============================
   THEME VARIABLES
=================================*/
:root {
    --bg-color: #05050a;
    --grid-color: rgba(0, 243, 255, 0.05);
    --primary-glow: #00f3ff;
    --secondary-glow: #8a2be2;
    --text-main: #e2e8f0;
    --text-muted: #94a3b8;
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
    background-color: var(--bg-color);
    color: var(--text-main);
    font-family: 'Inter', sans-serif;
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
    background-image:
        linear-gradient(var(--grid-color) 1px, transparent 1px),
        linear-gradient(90deg, var(--grid-color) 1px, transparent 1px);
    background-size: 40px 40px;
}

.glow-orb-1 {
    position: absolute; top: -10%; left: -10%;
    width: 500px; height: 500px;
    background: radial-gradient(circle, rgba(138,43,226,0.15) 0%, transparent 70%);
    z-index: 0;
}
.glow-orb-2 {
    position: absolute; bottom: -20%; right: -10%;
    width: 600px; height: 600px;
    background: radial-gradient(circle, rgba(0,243,255,0.1) 0%, transparent 70%);
    z-index: 0;
}

.hero-container {
    position: relative; z-index: 10;
    background: rgba(15, 15, 25, 0.6);
    backdrop-filter: blur(12px);
    border: 1px solid rgba(0, 243, 255, 0.2);
    border-radius: 20px;
    padding: 3rem 4rem;
    max-width: 800px;
    text-align: center;
    box-shadow: 0 0 40px rgba(0,0,0,0.5), inset 0 0 20px rgba(0,243,255,0.05);
}

.badge {
    display: inline-block;
    font-family: 'Orbitron', sans-serif;
    font-size: 0.8rem;
    color: var(--primary-glow);
    letter-spacing: 2px;
    text-transform: uppercase;
    padding: 5px 15px;
    border: 1px solid var(--primary-glow);
    border-radius: 50px;
    margin-bottom: 1.5rem;
    background: rgba(0, 243, 255, 0.05);
}

h1 {
    font-family: 'Rajdhani', sans-serif;
    font-size: 4rem;
    font-weight: 600;
    margin-bottom: 1rem;
    background: linear-gradient(to right, #ffffff, var(--primary-glow));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
}

p {
    font-size: 1.1rem;
    color: var(--text-muted);
    line-height: 1.6;
    margin-bottom: 2rem;
}

/* =========================================
   DARK FUTURISTIC N8N CHAT OVERRIDES
   ========================================= */

/* Floating button */
#n8n-chat .chat-button,
.n8n-chat-button {
    background: linear-gradient(135deg, #00f3ff, #8a2be2) !important;
    box-shadow: 0 0 20px rgba(0,243,255,0.6), 0 0 40px rgba(138,43,226,0.4) !important;
}

/* Chat window panel */
#n8n-chat .chat-window,
.n8n-chat-window {
    background: #020617 !important;
    border: 1px solid rgba(0,243,255,0.25) !important;
    box-shadow: 0 0 25px rgba(0,243,255,0.15), 0 0 60px rgba(138,43,226,0.12) !important;
    border-radius: 16px !important;
    overflow: hidden !important;
    transition: all 0.35s cubic-bezier(0.4,0,0.2,1) !important;
}

/* Fullscreen state */
#n8n-chat .chat-window.is-fullscreen {
    position: fixed !important;
    top: 0 !important; left: 0 !important;
    width: 100vw !important; height: 100vh !important;
    max-width: 100vw !important; max-height: 100vh !important;
    border-radius: 0 !important;
    z-index: 99999 !important;
    bottom: unset !important; right: unset !important;
}

/* Header */
#n8n-chat .chat-header,
.n8n-chat-header {
    background: linear-gradient(90deg, #01030a, #050b1f) !important;
    border-bottom: 1px solid rgba(0,243,255,0.2) !important;
    font-family: 'Orbitron', sans-serif !important;
    color: #00f3ff !important;
    letter-spacing: 1px !important;
    display: flex !important;
    align-items: center !important;
    padding: 12px 16px !important;
}

/* Header title */
#n8n-chat .chat-header p,
#n8n-chat .chat-header span,
#n8n-chat .chat-header h1,
#n8n-chat .chat-header h2,
.n8n-chat-header * {
    color: #00f3ff !important;
    font-family: 'Orbitron', sans-serif !important;
}

/* Body / messages area */
#n8n-chat .chat-messages-list,
#n8n-chat .chat-body,
.n8n-chat-body {
    background: #020617 !important;
    background-image: radial-gradient(circle at top, rgba(0,243,255,0.04), transparent 60%) !important;
}

/* Bot bubbles */
#n8n-chat .chat-message-from-bot .chat-message-text,
.n8n-chat-message-bot .n8n-chat-message-content {
    background: rgba(15, 23, 42, 0.9) !important;
    border: 1px solid rgba(138,43,226,0.35) !important;
    color: #cbd5f5 !important;
    box-shadow: 0 0 10px rgba(138,43,226,0.15) !important;
    border-radius: 12px !important;
}

/* User bubbles */
#n8n-chat .chat-message-from-user .chat-message-text,
.n8n-chat-message-user .n8n-chat-message-content {
    background: rgba(0,243,255,0.12) !important;
    border: 1px solid rgba(0,243,255,0.4) !important;
    color: #e0f7ff !important;
    box-shadow: 0 0 10px rgba(0,243,255,0.2) !important;
    border-radius: 12px !important;
}

/* Input footer */
#n8n-chat .chat-input,
#n8n-chat .chat-footer,
.n8n-chat-footer,
.n8n-chat-input {
    background: #01030a !important;
    border-top: 1px solid rgba(0,243,255,0.15) !important;
}

/* Textarea */
#n8n-chat .chat-input textarea,
#n8n-chat textarea,
.n8n-chat-input textarea {
    background: #020617 !important;
    color: #e2e8f0 !important;
    border: 1px solid rgba(0,243,255,0.25) !important;
    border-radius: 8px !important;
    font-family: 'Inter', sans-serif !important;
}

#n8n-chat textarea::placeholder,
.n8n-chat-input textarea::placeholder {
    color: #64748b !important;
}

/* Send button */
#n8n-chat .chat-input button[type="submit"],
#n8n-chat .chat-send-button,
.n8n-chat-send-button {
    background: linear-gradient(135deg, #00f3ff, #8a2be2) !important;
    border: none !important;
    box-shadow: 0 0 15px rgba(0,243,255,0.6) !important;
    border-radius: 8px !important;
}

/* File upload icon */
#n8n-chat .chat-input button,
.n8n-chat-input button {
    color: #00f3ff !important;
}

/* Welcome screen */
#n8n-chat .chat-welcome-screen,
.n8n-chat-welcome {
    background: #020617 !important;
    background-image: radial-gradient(circle at 50% 30%, rgba(0,243,255,0.07), transparent 60%) !important;
    color: #e2e8f0 !important;
}

#n8n-chat .chat-welcome-screen *,
.n8n-chat-welcome * {
    color: #e2e8f0 !important;
}

/* Start button on welcome screen */
#n8n-chat .chat-welcome-screen button,
.n8n-chat-welcome button {
    background: linear-gradient(135deg, rgba(0,243,255,0.15), rgba(138,43,226,0.15)) !important;
    border: 1px solid rgba(0,243,255,0.4) !important;
    color: #00f3ff !important;
    border-radius: 8px !important;

}

/* Scrollbar styling */
#n8n-chat *::-webkit-scrollbar { width: 4px; }
#n8n-chat *::-webkit-scrollbar-track { background: #01030a; }
#n8n-chat *::-webkit-scrollbar-thumb {
    background: rgba(0,243,255,0.3);
    border-radius: 4px;
}

/* ---- Fullscreen toggle button inside header ---- */
.fs-toggle-btn {
    margin-left: auto;
    background: transparent;
    border: 1px solid rgba(0,243,255,0.4);
    color: #00f3ff;
    font-size: 15px;
    cursor: pointer;
    padding: 4px 10px;
    border-radius: 6px;
    font-family: monospace;
    transition: background 0.2s, box-shadow 0.2s;
    flex-shrink: 0;
}
.fs-toggle-btn:hover {
    background: rgba(0,243,255,0.1);
    box-shadow: 0 0 8px rgba(0,243,255,0.4);
}
</style>
</head>

<body>

<div class="glow-orb-1"></div>
<div class="glow-orb-2"></div>

<main class="hero-container">
    <div class="badge">System Online</div>
    <h1>Neural Scholar AI</h1>
    <p>
        Advanced Retrieval-Augmented Generation (RAG) agent initialized.
        Upload your CV to begin intelligent analysis.
    </p>
</main>

<script type="module">
import { createChat } from 'https://cdn.jsdelivr.net/npm/@n8n/chat/dist/chat.bundle.es.js';

createChat({
    webhookUrl: 'http://localhost:5678/webhook/6d0bbc64-83c2-4b33-a483-78dda0a55870/chat',
    mode: 'window',
    position: 'bottom-right',
    showWelcomeScreen: true,
    title: 'Neural Scholar Interface',
    subtitle: 'AI CV Analysis System',
    initialMessages: [
        'System online.',
        'Upload your CV or begin analysis.'
    ],
    allowFileUploads: true
});

/* Inject fullscreen toggle button into header once chat is open */
function injectFullscreenButton() {
    const tryInject = setInterval(() => {
        // Try multiple possible header selectors
        const header =
            document.querySelector('#n8n-chat .chat-header') ||
            document.querySelector('.n8n-chat-header') ||
            document.querySelector('[class*="chat-header"]');

        const chatWindow =
            document.querySelector('#n8n-chat .chat-window') ||
            document.querySelector('.n8n-chat-window') ||
            document.querySelector('[class*="chat-window"]');

        if (header && chatWindow && !document.querySelector('.fs-toggle-btn')) {
            clearInterval(tryInject);

            const btn = document.createElement('button');
            btn.className = 'fs-toggle-btn';
            btn.innerHTML = '⛶';
            btn.title = 'Toggle Fullscreen';

            let isFullscreen = false;

            btn.addEventListener('click', () => {
                isFullscreen = !isFullscreen;
                chatWindow.classList.toggle('is-fullscreen', isFullscreen);
                btn.innerHTML = isFullscreen ? '✕' : '⛶';
                btn.title = isFullscreen ? 'Exit Fullscreen' : 'Toggle Fullscreen';
            });

            // ESC to exit fullscreen
            document.addEventListener('keydown', (e) => {
                if (e.key === 'Escape' && isFullscreen) {
                    isFullscreen = false;
                    chatWindow.classList.remove('is-fullscreen');
                    btn.innerHTML = '⛶';
                    btn.title = 'Toggle Fullscreen';
                }
            });

            header.appendChild(btn);
        }
    }, 300);

    // Give up after 15s
    setTimeout(() => clearInterval(tryInject), 15000);
}

// Start trying after chat bubble is likely rendered
setTimeout(injectFullscreenButton, 800);

// Also retry every time chat opens (in case DOM is recreated)
document.addEventListener('click', () => {
    setTimeout(() => {
        if (!document.querySelector('.fs-toggle-btn')) {
            injectFullscreenButton();
        }
    }, 400);
});
</script>

</body>
</html>
